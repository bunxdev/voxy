[package]
name = "voxy-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Explicit hardware-only GPU compute bridge for Voxy and Nopal"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
getrandom = "0.3"
libc = "0.2"

[profile.release]
strip = true
